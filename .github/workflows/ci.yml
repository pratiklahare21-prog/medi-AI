name: CI — medi AI / SastaRx

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # CI uses dummy secrets — real secrets injected via GitHub Secrets in deploy jobs
  GEMINI_API_KEY: 'CI_PLACEHOLDER_KEY'
  JWT_SECRET: 'ci-test-jwt-secret-key-32chars-min'
  PORT: '3001'

jobs:
  # ── Job 1: Lint & Type-Check ────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run lint

      - name: Validate .env.example has all required keys
        run: |
          echo "Checking required environment variable keys..."
          required_keys=("GEMINI_API_KEY" "APP_URL" "PORT" "JWT_SECRET" "DATABASE_URL")
          for key in "${required_keys[@]}"; do
            if ! grep -q "^${key}=" .env.example; then
              echo "ERROR: Missing required key '${key}' in .env.example"
              exit 1
            fi
          done
          echo "All required keys present in .env.example ✓"

  # ── Job 2: Unit & Integration Tests ────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: Production Build ─────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist/ directory not found after build"
            exit 1
          fi
          echo "Build output size:"
          du -sh dist/
          echo "Build ✓"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Job 4: Deploy to Staging (develop branch only) ─────────────────────────
  deploy-staging:
    name: Deploy → Staging (Cloud Run)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/medi-ai-staging:${{ github.sha }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        run: |
          gcloud run deploy medi-ai-staging \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/medi-ai-staging:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=staging" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format "value(status.url)" \
          | tee /tmp/url.txt
          echo "url=$(cat /tmp/url.txt)" >> $GITHUB_OUTPUT

  # ── Job 5: Deploy to Production (main + tagged releases only) ──────────────
  deploy-production:
    name: Deploy → Production (Cloud Run)
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'chore(release)')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/medi-ai:${{ github.sha }} \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/medi-ai:latest \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (Production)
        id: deploy
        run: |
          gcloud run deploy medi-ai-production \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/medi-ai:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,DATABASE_URL=db-url:latest" \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format "value(status.url)" \
          | tee /tmp/url.txt
          echo "url=$(cat /tmp/url.txt)" >> $GITHUB_OUTPUT

      - name: Post deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $(cat /tmp/url.txt)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
